# cmake-format configuration (https://cmake-format.readthedocs.io)
parse:
  # Signatures of the project's own helper functions (cmake/WeaveCHelpers.cmake
  # and unittests/CMakeLists.txt) so their keyword arguments format nicely.
  additional_commands:
    weavec_add_library:
      pargs:
        nargs: 1
        flags: [STATIC, SHARED, OBJECT, USES_LLVM]
      kwargs:
        SOURCES: "+"
        PUBLIC_DEPS: "+"
        PRIVATE_DEPS: "+"
    weavec_add_executable:
      pargs:
        nargs: 1
        flags: [USES_LLVM]
      kwargs:
        SOURCES: "+"
        DEPS: "+"
    weavec_add_unittest:
      pargs:
        nargs: 1
      kwargs:
        SOURCES: "+"
        DEPS: "+"
    weavec_link_llvm:
      pargs:
        nargs: "+"
    weavec_link_clang:
      pargs:
        nargs: "+"
    weavec_apply_warnings:
      pargs:
        nargs: 1
    weavec_apply_sanitizers:
      pargs:
        nargs: 1

format:
  line_width: 80
  tab_size: 2
  max_subgroups_hwrap: 2
  max_pargs_hwrap: 6
  dangle_parens: false
  min_prefix_chars: 4
  max_prefix_chars: 10
  command_case: lower
  keyword_case: upper
  enable_sort: true
  autosort: false

markup:
  enable_markup: false

lint:
  disabled_codes:
    # Allow long argument lists in add_library/target_sources.
    - C0113
  function_pattern: '[a-z_]+'
  macro_pattern: '[a-z_]+'
  global_var_pattern: '[A-Z][0-9A-Z_]+'
  internal_var_pattern: '_[A-Z][0-9A-Z_]+'
  local_var_pattern: '[a-z][a-z0-9_]+'
  private_var_pattern: '_[0-9a-z_]+'
  public_var_pattern: '[A-Z][0-9A-Z_]+'
  argument_var_pattern: '[a-z][a-z0-9_]+'
  keyword_pattern: '[A-Z][0-9A-Z_]+'

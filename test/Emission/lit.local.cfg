# RFC 0030, section 10: check emission. `%rewrite_oracle SOURCE EXPECTED
# WORKDIR [-- FLAGS]` runs the rewrite oracle of gate G8
# (Inputs/rewrite-oracle.py); the `*.expected.c` files live in Inputs/, which
# lit does not collect.
import os

config.substitutions.insert(
    0,
    (
        "%rewrite_oracle",
        " ".join(
            [
                "python3",
                os.path.join(os.path.dirname(__file__), "Inputs", "rewrite-oracle.py"),
                "--weavec-cc",
                os.path.join(config.weavec_tools_dir, "weavec-cc"),
                "--clang",
                config.clang or "clang",
                "--opt",
                os.path.join(config.llvm_tools_dir, "opt"),
                "--resource-dir",
                os.path.join(config.weavec_resource_dir, "include"),
            ]
        ),
    ),
)

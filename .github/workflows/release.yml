name: Release

# Called only after the CI aggregate succeeds on main. Keeping publication in
# this run also avoids relying on tags pushed by GITHUB_TOKEN triggering CI.
on:
  workflow_call:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    if: github.repository == 'weavefoundry/weavec'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      published: ${{ steps.draft.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check that main still matches the tested commit
        id: current
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main has advanced; its own CI run will handle the release."
          fi

      - uses: actions/setup-python@v7
        if: steps.current.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install release tooling
        if: steps.current.outputs.ready == 'true'
        run: python -m pip install -r .github/release-requirements.txt

      - name: Prepare version, changelog, commit and tag locally
        if: steps.current.outputs.ready == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release -c .releaserc.toml version \
            --no-push --no-vcs-release

      - name: Select the release tag
        if: steps.current.outputs.ready == 'true'
        id: target
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Also retry publication when CI is manually rerun on a release commit.
          # Ordinary docs/CI-only commits after a release have no tag at HEAD.
          if [ -n "$RELEASE_TAG" ] &&
             [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and verify the tagged source
        if: steps.target.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python scripts/package-source.py "$RELEASE_TAG" --output-dir dist

      - name: Push the release commit and tag together
        if: steps.version.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Draft the GitHub Release with the source downloads
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          # A draft holds every asset before the release is made public (the
          # publish job, after the toolchains are built and checked). A retry
          # repairs a draft; an already published release is left alone.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "$RELEASE_TAG is already published."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi
        id: draft

  # RFC 0038, section 6 and gate G8: the toolchains, built and tested for the
  # tag, checked on clean runners, and the formula and the container image
  # checked from them (toolchains.yml, which pull requests that change the
  # packaging run too).
  toolchains:
    name: Toolchains
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.published != 'true'
    uses: ./.github/workflows/toolchains.yml
    with:
      ref: ${{ needs.release.outputs.tag }}

  publish:
    name: Publish
    needs: [release, toolchains]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          pattern: toolchain-*
          path: dist
          merge-multiple: true
      - name: Checksums and the Homebrew formula
        run: |
          version="${RELEASE_TAG#v}"
          cd dist
          sha256sum weavec-*.tar.xz > SHA256SUMS.toolchains
          cd ..
          python3 scripts/render-formula.py "$version" dist --output dist/weavec.rb
      - name: Upload the toolchains
        run: |
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS.toolchains > dist/SHA256SUMS
          gh release upload "$RELEASE_TAG" dist/weavec-*.tar.xz dist/weavec.rb \
            dist/SHA256SUMS --clobber
      # The arm64 image's RUN step runs under emulation on this runner.
      - uses: docker/setup-qemu-action@v4
      - name: The container image
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar -xJf "dist/weavec-$version-linux-x86_64.tar.xz" -C dist/linux-amd64 --strip-components=1
          tar -xJf "dist/weavec-$version-linux-aarch64.tar.xz" -C dist/linux-arm64 --strip-components=1
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packaging/docker/Dockerfile \
            -t "ghcr.io/weavefoundry/weavec:$version" -t ghcr.io/weavefoundry/weavec:latest \
            --push .
      - name: Make the release public
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      # After publication: the formula's URLs are the release's assets.
      # GITHUB_TOKEN cannot write another repository; HOMEBREW_TAP_TOKEN, an
      # organization secret the WeaveFoundry projects share, is a token that
      # may push to weavefoundry/homebrew-tap (contents: write).
      - name: The Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set: copy weavec.rb from the $RELEASE_TAG release to Formula/weavec.rb in weavefoundry/homebrew-tap."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/weavefoundry/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Formula"
          cp dist/weavec.rb "$RUNNER_TEMP/tap/Formula/weavec.rb"
          cd "$RUNNER_TEMP/tap"
          # A new, empty tap has no branch yet: the formula goes on main.
          git checkout -B main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/weavec.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "weavec ${RELEASE_TAG#v}"
          # The tap holds every WeaveFoundry project's formula: a push that
          # lost a race with another project's release rebases onto it and
          # tries again.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "::error::could not push Formula/weavec.rb to weavefoundry/homebrew-tap"
          exit 1

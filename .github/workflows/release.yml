name: Release

# Called only after the CI aggregate succeeds on main. Keeping publication in
# this run also avoids relying on tags pushed by GITHUB_TOKEN triggering CI.
on:
  workflow_call:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    if: github.repository == 'weavefoundry/weavec'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      published: ${{ steps.draft.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check that main still matches the tested commit
        id: current
        env:
          TESTED_SHA: ${{ github.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main has advanced; its own CI run will handle the release."
          fi

      - uses: actions/setup-python@v7
        if: steps.current.outputs.ready == 'true'
        with:
          python-version: "3.12"

      - name: Install release tooling
        if: steps.current.outputs.ready == 'true'
        run: python -m pip install -r .github/release-requirements.txt

      - name: Prepare version, changelog, commit and tag locally
        if: steps.current.outputs.ready == 'true'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release -c .releaserc.toml version \
            --no-push --no-vcs-release

      - name: Select the release tag
        if: steps.current.outputs.ready == 'true'
        id: target
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Also retry publication when CI is manually rerun on a release commit.
          # Ordinary docs/CI-only commits after a release have no tag at HEAD.
          if [ -n "$RELEASE_TAG" ] &&
             [ "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Package and verify the tagged source
        if: steps.target.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python scripts/package-source.py "$RELEASE_TAG" --output-dir dist

      - name: Push the release commit and tag together
        if: steps.version.outputs.released == 'true'
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Draft the GitHub Release with the source downloads
        if: steps.target.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          # A draft holds every asset before the release is made public (the
          # publish job, after the toolchains are built and checked). A retry
          # repairs a draft; an already published release is left alone.
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/release.json" >/dev/null; then
              echo "$RELEASE_TAG is already published."
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS \
              --verify-tag --draft --title "$RELEASE_TAG" \
              --notes-file dist/release-notes.md
          fi
        id: draft

  # RFC 0038, section 6: a self-contained toolchain per platform, built with
  # the release preset (static LLVM on Linux, LLVM's libraries bundled on
  # Darwin), tested, packed as weavec-<version>-<os>-<arch>.tar.xz.
  toolchains:
    name: Toolchain (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.tag != '' && needs.release.outputs.published != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc 2.35 and later.
          - platform: linux-x86_64
            os: ubuntu-22.04
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
          # macOS 14 and later.
          - platform: darwin-arm64
            os: macos-14
    env:
      LLVM_VERSION: "23"
      LIT_VERSION: "23.1.0"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          wget --tries=5 --waitretry=10 -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION" all
          sudo apt-get install -y ninja-build
          echo "WEAVEC_LLVM_PREFIX=/usr/lib/llvm-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "CC=clang-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm ninja
          prefix="$(brew --prefix llvm)"
          echo "WEAVEC_LLVM_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "CC=$prefix/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$prefix/bin/clang++" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "lit==$LIT_VERSION"
      - name: Build and test
        run: |
          ulimit -c 0
          cmake --preset release
          cmake --build --preset release
          ctest --preset release -j "$(getconf _NPROCESSORS_ONLN)"
      - name: Pack
        run: |
          cd build/release
          cpack
          ls -l weavec-*.tar.xz
      - uses: actions/upload-artifact@v7
        with:
          name: toolchain-${{ matrix.platform }}
          path: build/release/weavec-*.tar.xz
          if-no-files-found: error

  # G8: each archive on a clean runner with no LLVM installed, moved after
  # unpacking: the README's examples, a shared library, the corpus gate's
  # quick check of two projects.
  smoke:
    name: Smoke test (${{ matrix.os }})
    needs: [release, toolchains]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          name: toolchain-${{ matrix.platform }}
          path: dist
      - name: The toolchain, moved after unpacking
        run: python3 scripts/check-toolchain.py dist/weavec-*.tar.xz
      - name: Corpus quick check
        run: |
          mkdir -p "$RUNNER_TEMP/tc"
          tar -xJf dist/weavec-*.tar.xz -C "$RUNNER_TEMP/tc"
          python3 scripts/corpus-gate.py --quick --only cJSON --only sds \
            --weavec-cc "$(echo "$RUNNER_TEMP"/tc/weavec-*/bin/weavec-cc)"

  publish:
    name: Publish
    needs: [release, toolchains, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/download-artifact@v7
        with:
          pattern: toolchain-*
          path: dist
          merge-multiple: true
      - name: Checksums and the Homebrew formula
        run: |
          version="${RELEASE_TAG#v}"
          cd dist
          sha256sum weavec-*.tar.xz > SHA256SUMS.toolchains
          cd ..
          python3 scripts/render-formula.py "$version" dist --output dist/weavec.rb
      - name: Upload the toolchains
        run: |
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          cat "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS.toolchains > dist/SHA256SUMS
          gh release upload "$RELEASE_TAG" dist/weavec-*.tar.xz dist/weavec.rb \
            dist/SHA256SUMS --clobber
      - name: The container image
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist/linux-amd64 dist/linux-arm64
          tar -xJf "dist/weavec-$version-linux-x86_64.tar.xz" -C dist/linux-amd64 --strip-components=1
          tar -xJf "dist/weavec-$version-linux-aarch64.tar.xz" -C dist/linux-arm64 --strip-components=1
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            -f packaging/docker/Dockerfile \
            -t "ghcr.io/weavefoundry/weavec:$version" -t ghcr.io/weavefoundry/weavec:latest \
            --push .
      - name: Make the release public
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

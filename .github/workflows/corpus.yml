name: Corpus

# Runs the full corpus gate (RFC 0035, section 11) over the projects pinned
# by SHA in test/corpus/manifest.json, but the sealed sets: the weavec
# analysis and the per-file enforcement ledgers (checked against
# test/corpus/triage.json and test/corpus/expected.json), each project's
# build and test suite with CC=weavec-cc in trap mode (rerun in report mode,
# and built once more with the reference compiler for the build-time gate),
# the injected bugs and the benchmarks (against the reference compiler and
# ASan). The gate clones the projects into build/corpus. Pull requests run
# --quick in CI.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: "23"

jobs:
  corpus:
    name: Corpus regression
    runs-on: ubuntu-24.04
    # --full builds every project three times (trap, report, reference), runs
    # its tests twice, builds each injection and runs every benchmark three
    # ways: the longest job GitHub allows.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM
        run: |
          # Chrome is unused; its preinstalled apt source can fail with hash
          # mismatches and block LLVM installation during repository updates.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VERSION" all
          sudo apt-get install -y ninja-build ccache
          echo "WEAVEC_LLVM_PREFIX=/usr/lib/llvm-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "CC=clang-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "CXX=clang++-$LLVM_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ubuntu-24.04-ci-release-corpus
          max-size: 500M

      - name: Configure and build
        run: |
          cmake --preset ci-release -DWEAVEC_BUILD_TESTS=OFF
          cmake --build --preset ci-release

      - name: Run corpus gate
        run: |
          python3 scripts/corpus-gate.py --full \
            --weavec build/ci-release/bin/weavec \
            --weavec-cc build/ci-release/bin/weavec-cc \
            --json corpus-gate-full.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-gate-full
          path: corpus-gate-full.json
          if-no-files-found: ignore

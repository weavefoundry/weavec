name: Feature request
description: Propose a guard, runtime, driver, or tooling improvement
title: "[feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what is painful?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >
        How should WeaveC behave? Include example C code and what you would
        expect `weavec-cc` and the program it builds to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Affected areas
      options:
        - label: Guard passes (`lib/Frontend/Guard*.cpp`)
        - label: Library table (`lib/Core/LibrarySpec.txt`)
        - label: Runtime (`runtime/`)
        - label: Driver (`lib/Frontend/Driver.cpp`, `tools/weavec-cc`)
        - label: Build, CI, or documentation

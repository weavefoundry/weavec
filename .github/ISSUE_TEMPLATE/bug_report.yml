name: Bug report
description: weavec-cc crashed, trapped on a correct program, or let a memory bug through
title: "[bug]: "
labels: [bug, needs-triage]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of bug
      options:
        - False trap (a correct program stopped)
        - Missed bug (an unsafe access ran)
        - Crash / assertion failure in weavec-cc
        - Wrong or unhelpful report
        - Project fails to build with weavec-cc (drop-in)
        - Performance (run time, build time, memory)
        - Build or installation problem
        - Other
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Minimal reproducer
      description: >
        The smallest C program that shows the problem, plus the exact
        `weavec-cc` command line and how you ran the program. Please avoid
        system headers where possible.
      render: c
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: >
        The full report (`weavec: <kind> at ...`), compiler output or crash
        backtrace. `WEAVEC_RT_BACKTRACE=1` adds the stack of the access that
        stopped the program.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: weavec-cc --version
      description: The `weavec-cc version` lines at the end of `weavec-cc --version`.
      placeholder: "weavec-cc version 0.16.0 (abc123def456), built with LLVM 23.1.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15 / arm64, Ubuntu 24.04 / x86_64, ..."
    validations:
      required: true
